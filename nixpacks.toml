# Build da API no Railway (nixpacks). Detalhes e histórico em DEPLOY_GUIDE.md ("Railway / nixpacks").
#
# O package.json raiz exige node >=22.12 <23 e pnpm 9.12.3 com engine-strict=true; versões
# diferentes abortam o `pnpm install` com ERR_PNPM_UNSUPPORTED_ENGINE.
# - Node: fixamos um archive do nixpkgs (nixpkgs-unstable, abr/2026) em que nodejs_22 = 22.22.2,
#   a mesma versão do .nvmrc e das imagens Docker (o archive padrão do nixpacks 1.41 para Node 22
#   traz 22.14.0). As saídas x86_64-linux e aarch64-linux estão no cache.nixos.org (sem compilar).
# - pnpm: vem do campo packageManager via Corepack (o que o provider Node faz por padrão e
#   que a lista de comandos abaixo substitui); o pnpm do nixpkgs é 9.15.x.
# - openssl: o provider o adiciona quando há Prisma, mas uma lista nixPkgs própria o remove.

[phases.setup]
nixPkgs = ['nodejs_22', 'openssl']
nixpkgsArchive = '01fbdeef22b76df85ea168fbfe1bfd9e63681b30'

[phases.install]
cmds = [
  'npm install -g corepack@0.24.1 && corepack enable',
  'pnpm install --frozen-lockfile --prefer-offline'
]

# A API empacota @ticketz/{core,shared,storage,contracts,wa-contracts} a partir do código-fonte
# (paths do apps/api/tsconfig.json); @leadengine/wa-status é compilado no postinstall.
[phases.build]
cmds = [
  'pnpm --filter @ticketz/storage run prisma:generate',
  'pnpm --filter @ticketz/api run build'
]

[start]
cmd = 'pnpm --filter @ticketz/api run start'
